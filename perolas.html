<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pérolas — Cinema</title>
  
  <!-- Fonte Ubuntu do Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       VARIÁVEIS GLOBAIS (Esquema Claro Pastel)
       ========================================================================== */
    :root {
      --bg: #fbf9f5;                  /* Fundo suave creme / off-white */
      --card-bg: #ffffff;              /* Branco puro para cartões e molduras */
      --card-border: #e5ded6;          /* Linha divisória em tom pastel subtil */
      --accent: #b85d43;               /* Terracota pastel suave para títulos e ênfase */
      --text-main: #2d3142;            /* Ardósia escuro para leitura nítida */
      --text-muted: #6b7280;           /* Cinzento neutro para legendas e subtítulo */
      --shadow: 0 4px 20px -2px rgba(45, 49, 66, 0.07);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Ubuntu', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2.5rem 1.2rem;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    header {
      margin-bottom: 1rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--card-border);
    }

    h1 {
      font-size: 2.3rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.5rem;
      letter-spacing: 0.02em;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      font-weight: 400;
    }

    .video-item {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Contentor responsivo para manter a proporção 16:9 */
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* Proporção 16:9 */
      height: 0;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
      background-color: #000;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-description {
      font-size: 0.98rem;
      color: var(--text-main);
      padding: 0 0.25rem;
    }

    hr.divider {
      border: 0;
      height: 1px;
      background: var(--card-border);
      margin-top: 1.25rem;
    }

    @media (max-width: 640px) {
      body {
        padding: 1.5rem 1rem;
      }

      h1 {
        font-size: 1.9rem;
      }

      .subtitle {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <main class="container">
    
    <header>
      <h1>Pérolas</h1>
      <p class="subtitle">Cenas absurdas, mas que funcionaram.</p>
    </header>

    <!-- Primeiro Vídeo -->
    <div class="video-item">
      <div class="video-wrapper">
        <iframe 
          src="https://www.youtube-nocookie.com/embed/Z6oeAdemFZw" 
          title="Reprodutor de vídeo YouTube 1" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          referrerpolicy="strict-origin-when-cross-origin" 
          allowfullscreen>
        </iframe>
      </div>
      <p class="video-description">The Pink Panther (2006)</p>
      <hr class="divider">
    </div>

    <!-- Segundo Vídeo -->
    <div class="video-item">
      <div class="video-wrapper">
        <iframe 
          src="https://www.youtube-nocookie.com/embed/xd4j-dQyHEQ" 
          title="Reprodutor de vídeo YouTube 2" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          referrerpolicy="strict-origin-when-cross-origin" 
          allowfullscreen>
        </iframe>
      </div>
      <p class="video-description">Shrek (2001)</p>
      <hr class="divider">
    </div>

    <!-- Terceiro Vídeo -->
    <div class="video-item">
      <div class="video-wrapper">
        <iframe 
          src="https://www.youtube-nocookie.com/embed/TkdbqK4iUsU"
          title="Reprodutor de vídeo YouTube 3" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          referrerpolicy="strict-origin-when-cross-origin" 
          allowfullscreen>
        </iframe>
      </div>
      <p class="video-description">Hot Shots! (1991)</p>
    </div>

  </main>

</body>
</html>
